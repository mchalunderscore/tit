{% extends "base.html" %}
{% block title %}Create organization · tit{% endblock %}
{% block content %}
  <h1>Create organization</h1>
  <section class="create-form">
    <form action="/organizations" method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label for="organization-name">Name</label>
        <input id="organization-name" name="name" required maxlength="40" pattern="([a-z0-9]|[a-z0-9][a-z0-9-]*[a-z0-9])">
      </div>
      <div class="field">
        <label for="organization-display-name">Display name</label>
        <input id="organization-display-name" name="display-name" required maxlength="100">
      </div>
      <div class="field">
        <label for="organization-description">Description</label>
        <textarea id="organization-description" name="description" maxlength="512" rows="5"></textarea>
      </div>
      <button type="submit">Create organization</button>
    </form>
  </section>
{% endblock %}
